[package]
name = "locaryn-plugin-vision-ocr"
version = "2.1.0"
edition = "2021"
description = "Official Locaryn Extension: Vision, OCR & Object Detection (Florence-2, GOT-OCR2, YOLO)"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "locaryn-vision-ocr-mcp"
path = "src/bin/vision_ocr_mcp.rs"

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[workspace]
